<section class="card">
  <h1>Connexion</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Email<input type="email" formControlName="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="error">Saisissez une adresse email valide.</small>
      }
    </label>
    <label>Mot de passe<input type="password" formControlName="password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="error">Le mot de passe est requis.</small>
      }
    </label>
    <button type="submit" [disabled]="loading()">{{ loading() ? 'Connexion…' : 'Se connecter' }}</button>
  </form>
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  <p><a routerLink="/register">Créer un compte</a></p>
</section>
