<header class="topbar">
  <a class="brand" routerLink="/tracks">
    <b>Guitar Practice Cloud</b>
    <small>Le cloud qui manque à votre ampli</small>
  </a>
  <nav aria-label="Navigation principale">
    <a routerLink="/tracks" routerLinkActive="active" ariaCurrentWhenActive="page">Backing tracks</a>
    <a routerLink="/groups" routerLinkActive="active" ariaCurrentWhenActive="page">Groupes</a>
    <a routerLink="/leaderboard" routerLinkActive="active" ariaCurrentWhenActive="page">Classement</a>
    <a routerLink="/shop" routerLinkActive="active" ariaCurrentWhenActive="page">Boutique</a>
    <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">Profil</a>
    @if (auth.currentUser(); as user) {
      <a class="me" routerLink="/shop" [attr.aria-label]="user.name + ', ' + user.coins + ' points'">
        <app-avatar-badge [avatar]="user.avatar" [size]="30" />
        <span>{{ user.coins | number }} pts</span>
      </a>
    }
    @if (auth.token()) {
      <button type="button" class="ghost" (click)="logout()">Déconnexion</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Connexion</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
